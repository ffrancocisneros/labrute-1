on:
  # Deshabilitado para ejecuciones automáticas porque está fallando con error HTML de GitHub.
  # Se puede volver a activar y depurar más adelante.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        with:
          release-type: node
          package-name: labrute
          bump-minor-pre-major: true
          default-branch: main
          command: manifest
